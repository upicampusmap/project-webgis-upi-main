<!DOCTYPE html>
<html lang="id">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="application-version" content="2026.10.19.3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title>Interactive Campus Map UPI</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet.markercluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <!-- Font Awesome untuk icon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  >

  <!-- CSS khusus halaman peta -->
  <link rel="stylesheet" href="assets/css/map.css?v=2026.10.19.3" />
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <img src="images/logo.png" alt="Logo UPI">
      <div class="brand-copy"><span class="brand-eyebrow">BUMI SILIWANGI</span><h1>UPI Campus Map</h1></div>
    </div>

    <div class="topbar-right">
      <a href="index.html" class="topbar-btn" aria-label="Kembali ke beranda" title="Beranda"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Beranda</span></a>
      <button
        class="topbar-icon topbar-locate-btn"
        id="locateMeBtn"
        onclick="locateMe()"
        title="Posisi Saya"
      >
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
      <button
        class="topbar-icon topbar-remove-loc-btn"
        id="removeLocationBtn"
        onclick="removeUserLocation()"
        title="Hapus Posisi"
        style="display:none;"
      >
        <i class="fa-solid fa-location-xmark"></i>
      </button>
      <button class="topbar-icon" onclick="resetMap()" title="Kembalikan Tampilan">
        <i class="fa-solid fa-expand"></i>
      </button>
      <button class="topbar-icon topbar-print" onclick="printMap()" title="Cetak">
        <i class="fa-solid fa-print"></i>
      </button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" data-view="browse" data-sheet-size="compact" aria-label="Panel informasi kampus">
    <button class="mobile-sheet-header" aria-controls="sidebarContent" aria-expanded="false" type="button" onclick="toggleSidebar()">
      <span id="mobileSheetAction">Perbesar</span>
      <strong id="mobileSheetTitle">Lokasi</strong>
      <i class="fa-solid fa-chevron-up" id="mobileSheetIcon"></i>
    </button>

    <div class="search-section">
      <div class="search-box">
        <div class="search-field">
        <input
          type="text"
          id="searchInput"
          aria-label="Cari nama gedung" aria-controls="searchSuggestions" aria-expanded="false"
          placeholder="Cari nama gedung..."
          autocomplete="off"
        >
        <button type="button" id="clearSearchBtn" class="search-clear" aria-label="Hapus pencarian" title="Hapus pencarian" hidden><span aria-hidden="true">×</span></button>
        </div>
        <button type="button" class="search-submit" onclick="searchBuilding()" aria-label="Cari gedung">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <div id="searchSuggestions" class="search-suggestions"></div>
      <div id="searchMessage" role="status" class="search-message" style="display:none;"></div>
    </div>

    <div class="sidebar-tabs">
      <button class="active" data-tab="locations" onclick="showTab('locations')"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Lokasi</button>
      <button data-tab="layers" onclick="showTab('layers')"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>Layer</button>
      <button data-tab="info" onclick="showTab('info')"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>Info</button>
    </div>

    <div class="sidebar-content" id="sidebarContent">
      <!-- Konten sidebar akan diisi dari JavaScript -->
    </div>

    <div class="sidebar-footer">
      <strong>Universitas Pendidikan Indonesia</strong>
      Jl. Dr. Setiabudi No. 229<br>
      Bandung, Jawa Barat
    </div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Buka atau tutup panel lokasi" aria-controls="sidebar" aria-expanded="true" onclick="toggleSidebar()">
    <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
  </button>

  <!-- MAP -->
  <div id="map" role="region" aria-label="Peta interaktif kampus UPI"></div>

  <div class="map-hint" aria-hidden="true"><span><i class="fa-solid fa-hand-pointer"></i> Pilih penanda untuk melihat informasi lokasi</span></div>

  <!-- LEGEND CONTROL -->
  <div class="map-legend" id="mapLegend">
    <button class="map-legend-toggle" aria-controls="mapLegendPanel" aria-expanded="false" onclick="toggleLegend()" title="Tampilkan/sembunyikan legenda">
      <i class="fa-solid fa-list-ul"></i>
      <span class="map-legend-toggle-text">Legenda</span>
    </button>
    <div class="map-legend-panel" id="mapLegendPanel">
      <div class="map-legend-header">
        <strong>Legenda Kategori</strong>
        <button class="map-legend-close" onclick="toggleLegend()" title="Tutup">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="map-legend-items" id="mapLegendItems"></div>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div class="map-loading-overlay" id="mapLoadingOverlay">
    <div class="map-loading-card">
      <div class="map-loading-spinner"></div>
      <div class="map-loading-text">Memuat data kampus...</div>
    </div>
  </div>

  <!-- ERROR OVERLAY -->
  <div class="map-error-overlay" id="mapErrorOverlay" style="display:none;">
    <div class="map-error-card">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div class="map-error-title">Gagal memuat data gedung</div>
      <div class="map-error-text" id="mapErrorText">Periksa koneksi internet Anda lalu coba lagi.</div>
      <button class="map-error-retry" onclick="retryLoadBuildings()">
        <i class="fa-solid fa-rotate-right"></i> Coba Lagi
      </button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.markercluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="tests/browser-preload.js?v=2026.10.19.3"></script>
  <script defer src="assets/js/bootstrap.js?v=2026.10.19.3"></script>
  <script type="module" src="tests/browser-regression.js?v=2026.10.19.3"></script>

</body>
</html>
